<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>MCD — Commande & Livraison</title>
<style>
  :root{
    --bg:#0b1220;
    --grid:#141d33;
    --panel:#101a2e;
    --line:#3a4a6b;
    --line-soft:#26324d;
    --text:#e8ecf5;
    --sub:#93a2c2;
    --pk:#ffcf6b;
    --assoc:#f4b942;
    --assoc-bg:#2a2210;
    --zone-user:#4f8cff;
    --zone-catalog:#37c979;
    --zone-order:#f4b942;
    --zone-pay:#ff6b6b;
    --zone-deliv:#c084fc;
    --zone-engage:#38d9d9;
    --mono: "JetBrains Mono","Fira Code",Consolas,monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:var(--mono);}
  #topbar{
    position:fixed;top:0;left:0;right:0;height:64px;z-index:50;
    background:rgba(11,18,32,0.92);backdrop-filter:blur(6px);
    border-bottom:1px solid var(--line-soft);
    display:flex;align-items:center;justify-content:space-between;
    padding:0 22px;
  }
  #topbar h1{font-size:15px;font-weight:600;letter-spacing:.04em;margin:0;color:var(--text);}
  #topbar h1 span{color:var(--assoc);}
  #topbar .sub{font-size:11px;color:var(--sub);margin-top:2px;}
  #controls{display:flex;gap:8px;align-items:center;}
  #controls button{
    background:var(--grid);color:var(--text);border:1px solid var(--line-soft);
    border-radius:6px;width:32px;height:32px;font-size:16px;cursor:pointer;
  }
  #controls button:hover{border-color:var(--assoc);color:var(--assoc);}
  #zoomLabel{font-size:11px;color:var(--sub);width:44px;text-align:center;}

  #scrollwrap{
    position:absolute;top:64px;left:0;right:0;bottom:0;overflow:auto;
    background-image:
      linear-gradient(var(--grid) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid) 1px, transparent 1px);
    background-size:40px 40px;
  }
  #canvas{
    position:relative;
    width:3100px;height:3300px;
    transform-origin: 0 0;
  }
  svg#links{position:absolute;top:0;left:0;overflow:visible;pointer-events:none;}

  .zoneLabel{
    position:absolute;font-size:11px;letter-spacing:.14em;text-transform:uppercase;
    color:var(--sub);border-left:2px solid var(--zc);padding-left:8px;
  }

  .entity{
    position:absolute;width:210px;background:var(--panel);
    border:1px solid var(--line-soft);border-radius:8px;
    box-shadow:0 6px 18px rgba(0,0,0,.35);
    overflow:hidden;z-index:3;
  }
  .entity .head{
    padding:8px 10px;font-size:12.5px;font-weight:700;letter-spacing:.03em;
    color:#0b1220;background:var(--zc);
  }
  .entity ul{list-style:none;margin:0;padding:6px 0;}
  .entity li{
    font-size:10.8px;padding:3px 10px;color:var(--sub);
    display:flex;justify-content:space-between;gap:8px;white-space:nowrap;
  }
  .entity li.pk{color:var(--pk);font-weight:700;border-bottom:1px dashed var(--line-soft);}
  .entity li .type{color:#5b6a8c;font-style:italic;}

  .assoc{
    position:absolute;min-width:150px;max-width:190px;
    background:var(--assoc-bg);border:1.5px solid var(--assoc);
    border-radius:999px;padding:7px 14px;text-align:center;z-index:4;
  }
  .assoc .verb{font-size:11.5px;font-weight:700;color:var(--assoc);letter-spacing:.03em;}
  .assoc .attrs{margin-top:3px;font-size:9.3px;color:#d8c48a;line-height:1.5;}
  .assoc .attrs i{color:#93844f;}
  .assoc.xor{border-style:dashed;}

  .card{
    position:absolute;font-size:10px;font-weight:700;color:#0b1220;
    background:var(--assoc);padding:1px 5px;border-radius:4px;z-index:6;
  }

  #legend{
    position:absolute;left:3150px;top:0;width:340px;
  }
  #legend .box{
    background:var(--panel);border:1px solid var(--line-soft);border-radius:10px;
    padding:16px 18px;margin-bottom:16px;font-size:11.5px;color:var(--sub);line-height:1.7;
  }
  #legend h3{color:var(--text);font-size:12.5px;margin:0 0 8px;letter-spacing:.05em;text-transform:uppercase;}
  #legend .swatch{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:7px;}
  #legend code{color:var(--assoc);}
</style>
</head>
<body>

<div id="topbar">
  <div>
    <h1>MCD — Module <span>Commande &amp; Livraison</span></h1>
    <div class="sub">33 entités · 51 associations · notation Merise (min,max) — glisser une entité pour la déplacer, zoomer avec les boutons</div>
  </div>
  <div id="controls">
    <button id="zoomOut">−</button>
    <span id="zoomLabel">100%</span>
    <button id="zoomIn">+</button>
    <button id="zoomReset" style="width:auto;padding:0 10px;">reset</button>
  </div>
</div>

<div id="scrollwrap">
  <div id="canvas">
    <svg id="links" width="3100" height="3300"></svg>

    <div id="legend"></div>

/* =========================================================
   TRACÉ DES LIENS (SVG), calculé après mise en page
   ========================================================= */
function pointOnEdge(rect, towardX, towardY, containerRect){
  // point on the rectangle border closest to a target point, in canvas coords
  const cx = rect.left - containerRect.left + rect.width/2;
  const cy = rect.top - containerRect.top + rect.height/2;
  const dx = towardX - cx, dy = towardY - cy;
  const w = rect.width/2, h = rect.height/2;
  if(dx===0 && dy===0) return {x:cx,y:cy};
  const scaleX = w/Math.abs(dx || 1e-6);
  const scaleY = h/Math.abs(dy || 1e-6);
  const scale = Math.min(scaleX, scaleY);
  return {x: cx+dx*scale, y: cy+dy*scale};
}

function drawLinks(){
  svg.innerHTML='';
  canvas.querySelectorAll('.card').forEach(c=>c.remove());
  const containerRect = canvas.getBoundingClientRect();
  const scale = currentScale;
  RELATIONS.forEach(r=>{
    const aRect = assocEls[r.id].getBoundingClientRect();
    const aCenter = {
      x:(aRect.left-containerRect.left)/scale + aRect.width/scale/2,
      y:(aRect.top-containerRect.top)/scale + aRect.height/scale/2
    };
    r.links.forEach(([entId,card])=>{
      const eRect = entityEls[entId].getBoundingClientRect();
      const eRectC = {
        left:(eRect.left-containerRect.left)/scale, top:(eRect.top-containerRect.top)/scale,
        width:eRect.width/scale, height:eRect.height/scale
      };
      const p1 = pointOnEdge({left:eRectC.left+containerRect.left,top:eRectC.top+containerRect.top,width:eRectC.width,height:eRectC.height}, aCenter.x+containerRect.left, aCenter.y+containerRect.top, containerRect);
      const line = document.createElementNS('http://www.w3.org/2000/svg','line');
      line.setAttribute('x1', p1.x); line.setAttribute('y1', p1.y);
      line.setAttribute('x2', aCenter.x); line.setAttribute('y2', aCenter.y);
      line.setAttribute('stroke', r.xor ? '#ff6b6b' : 'var(--line)');
      line.setAttribute('stroke-width','1.4');
      line.setAttribute('stroke-dasharray', r.xor ? '4,3' : 'none');
      svg.appendChild(line);

      // cardinality label near entity end, offset a bit toward association
      const lx = p1.x + (aCenter.x-p1.x)*0.16;
      const ly = p1.y + (aCenter.y-p1.y)*0.16;
      const label = document.createElement('div');
      label.className='card';
      label.textContent=card;
      label.style.left=lx+'px'; label.style.top=ly+'px';
      canvas.appendChild(label);
    });
  });
}

/* =========================================================
   DEPLACEMENT DES ENTITES (glisser-deposer)
   ========================================================= */
(function enableDrag(){
  let dragged=null, startX=0, startY=0, originX=0, originY=0;
  Object.entries(entityEls).forEach(([id,el])=>{
    el.style.cursor='grab';
    el.addEventListener('mousedown', ev=>{
      dragged=el; el.style.cursor='grabbing'; el.style.zIndex=20;
      startX=ev.clientX; startY=ev.clientY;
      originX=parseFloat(el.style.left); originY=parseFloat(el.style.top);
      ev.preventDefault();
    });
  });
  window.addEventListener('mousemove', ev=>{
    if(!dragged) return;
    dragged.style.left = (originX + (ev.clientX-startX)/currentScale) + 'px';
    dragged.style.top  = (originY + (ev.clientY-startY)/currentScale) + 'px';
    requestAnimationFrame(drawLinks);
  });
  window.addEventListener('mouseup', ()=>{
    if(!dragged) return;
    dragged.style.cursor='grab'; dragged.style.zIndex=3; dragged=null;
    requestAnimationFrame(drawLinks);
  });
})();

/* =========================================================
   ZOOM / PAN
   ========================================================= */
let currentScale = 1;
function applyScale(){
  canvas.style.transform = 'scale('+currentScale+')';
  document.getElementById('zoomLabel').textContent = Math.round(currentScale*100)+'%';
  requestAnimationFrame(drawLinks);
}
document.getElementById('zoomIn').onclick = ()=>{ currentScale=Math.min(1.6,currentScale+0.1); applyScale(); };
document.getElementById('zoomOut').onclick = ()=>{ currentScale=Math.max(0.4,currentScale-0.1); applyScale(); };
document.getElementById('zoomReset').onclick = ()=>{ currentScale=1; applyScale(); };

window.addEventListener('resize', ()=>requestAnimationFrame(drawLinks));
window.addEventListener('load', ()=>{
  // give the browser one frame to lay out entity/assoc boxes before measuring
  requestAnimationFrame(()=>requestAnimationFrame(drawLinks));
});
setTimeout(drawLinks, 60);
